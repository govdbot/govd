name: docker-lint

on:
  workflow_dispatch:

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: lint Dockerfile
        uses: hadolint/hadolint-action@master
        with:
          dockerfile: "Dockerfile"

      - name: lint Dockerfile.dev
        uses: hadolint/hadolint-action@master
        with:
          dockerfile: "Dockerfile.dev"